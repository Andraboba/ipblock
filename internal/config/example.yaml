# Настройки ipblock.
# После правки файл подхватывается автоматически при следующей проверке.
#
# Принцип: всё перечисленное в правилах ЗАКРЫТО всегда и открывается только на то
# время, пока подтверждено, что компьютер выходит в сеть с разрешённого адреса.

# Как часто перепроверять IP (минимум 5s). Смена сети (другой Wi-Fi, кабель, VPN)
# замечается сразу, без ожидания этого интервала.
check_interval: 20s

# Что делать, когда сервис останавливается:
#   lock  — закрыть доступ полностью (по умолчанию)
#   clear — снять все блокировки
on_stop: lock

rules:
  # Рабочая почта открывается только из офиса.
  - name: рабочая почта
    # Какой IP сравнивать с allow_from:
    #   public — внешний адрес, под которым вас видит интернет (офисный NAT/провайдер)
    #   local  — адрес сетевой карты/Wi-Fi внутри сети (например 10.20.x.x)
    #   any    — подойдёт любой из них
    ip_source: public

    # Откуда доступ РАЗРЕШЁН. Достаточно совпадения с любой строкой.
    # IPv4 и IPv6 проверяются отдельно: если здесь только IPv4, по IPv6 доступ закрыт всегда.
    allow_from:
      - 203.0.113.17               # один адрес
      - 203.0.113.0/24             # подсеть (маска) — если адрес иногда меняется
      - 198.51.100.10-198.51.100.40  # диапазон
      - 192.0.2.*                  # шаблон по октетам (* — что угодно, ? — одна цифра)

    # Сайты. Каждый поддомен указывается отдельно
    # (mail.example.com и example.com — разные записи).
    domains:
      - mail.example.com
      - webmail.example.com

    # Пока доступ открыт, сервис запоминает IP-адреса этих сайтов и потом закрывает
    # их в файрволе — надёжнее одного hosts. Может задеть чужие сайты на тех же
    # адресах (CDN); тогда выключите: resolve_domains: false
    # resolve_domains: true

    # IP-адреса и подсети серверов. Самый надёжный способ: закрываются файрволом
    # на уровне ядра. Если знаете адреса почтового сервера — укажите их здесь.
    ips:
      - 192.0.2.50
      - 192.0.2.128/25

    # Программы.
    #   action: network — программе закрыт выход в сеть (только Windows; по умолчанию там)
    #   action: kill    — то же и вдобавок программа закрывается, пока доступ запрещён
    # В Windows можно указать папку — закроются все .exe в ней.
    # В macOS сеть отдельной программе закрыть нельзя, поэтому там всегда kill;
    # для строгой защиты на Mac обязательно перечислите domains/ips серверов программы.
    apps:
      - windows: 'C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE'
        darwin: /Applications/Microsoft Outlook.app
        action: kill

  # Если VPN ведёт трафик к разным сайтам через разные серверы, сервисы проверки видят
  # разные внешние IP (это показывают `ipblock check` и панель управления). Правило
  # открывается, только если разрешены все увиденные адреса. Иначе укажите в правиле
  # сервис проверки, который идёт тем же путём, что и защищаемый сайт:
  #   ip_services:
  #     - https://icanhazip.com

  # Пример: рабочий VPN, который пускает через себя только рабочие адреса.
  # Внешний IP при этом остаётся домашним, поэтому сравниваем адрес VPN-адаптера:
  # доступ будет возможен только через туннель.
  # - name: почта через VPN
  #   ip_source: any
  #   allow_from:
  #     - 203.0.113.0/24   # офис
  #     - 10.8.0.0/24      # адреса, которые выдаёт рабочий VPN
  #   ips:
  #     - 192.0.2.0/24

  # Пример: внутренний сервис доступен только из офисной локальной сети.
  # - name: внутренний портал
  #   ip_source: local
  #   allow_from:
  #     - 10.20.0.0/16
  #   domains:
  #     - portal.example.com
